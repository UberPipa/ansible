---
- name: Отключить cdrom-репозиторий
  replace:
    path: /etc/apt/sources.list
    regexp: '^deb cdrom:'
    replace: '# \g<0>'

- name: Раскомментировать основные репозитории Astra Linux
  replace:
    path: /etc/apt/sources.list
    regexp: '^#(deb https://download\.astralinux\.ru/.*)'
    replace: '\1'

- name: upgrade (Astra)
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: dist-upgrade (Astra)
  apt:
    upgrade: dist